# os/rhel/packages.ini — RPM names, by group. One group per [section].
# Default groups installed by `sys base`: core editors git monitor network ssh
# crypt security containers. Opt in with:  sys base --with build --with autotools
# A name missing from your release is skipped and reported, never fatal.

[core]
bash-completion curl wget rsync tar gzip bzip2 xz zstd unzip zip
which file tree less jq findutils procps-ng lsof dnf-utils

[editors]
vim-enhanced nano tmux

[git]
git git-lfs tig

[monitor]
htop btop iotop sysstat ncdu smartmontools mdadm lvm2 xfsprogs

[network]
bind-utils iproute net-tools nmap-ncat traceroute mtr wireguard-tools

# ssh-keygen, ssh-agent, ssh-add, ssh-copy-id (client) + sshd (server)
[ssh]
openssh-clients openssh-server

# git-crypt: EPEL 9/10. gnupg2: needed to share a git-crypt key by GPG identity.
[crypt]
git-crypt gnupg2

[security]
acl fail2ban firewalld policycoreutils-python-utils setools-console dnf-automatic chrony

[containers]
podman podman-compose buildah skopeo container-selinux apptainer

# Opt-in: compiled scientific codes (C, Fortran, lex/yacc)
[build]
gcc gcc-c++ gcc-gfortran flex bison make pkgconf-pkg-config patch diffutils

# Opt-in: autotools / CMake projects
[autotools]
cmake autoconf automake libtool
