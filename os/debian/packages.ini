# os/debian/packages.ini — deb names, by group. Same group names as os/rhel.
# Default groups installed by `sys base`: core editors git monitor network ssh
# crypt security containers. Opt in with:  sys base --with build --with autotools
# A name missing from your release is skipped and reported, never fatal.

[core]
bash-completion curl wget rsync tar gzip bzip2 xz-utils zstd unzip zip
debianutils file tree less jq findutils procps lsof

[editors]
vim nano tmux

[git]
git git-lfs tig

[monitor]
htop btop iotop sysstat ncdu smartmontools mdadm lvm2 xfsprogs

[network]
bind9-dnsutils iproute2 net-tools netcat-openbsd traceroute mtr-tiny wireguard-tools

# ssh-keygen, ssh-agent, ssh-add, ssh-copy-id (client) + sshd (server)
[ssh]
openssh-client openssh-server

[crypt]
git-crypt gnupg

[security]
acl fail2ban python3-systemd ufw apparmor-utils unattended-upgrades chrony

[containers]
podman buildah skopeo apptainer

# Opt-in: compiled scientific codes (C, Fortran, lex/yacc)
[build]
gcc g++ gfortran flex bison make pkgconf patch diffutils

# Opt-in: autotools / CMake projects
[autotools]
cmake autoconf automake libtool
